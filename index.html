<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TALABOT — Admin Design Preview</title><style>:root{font-family:system-ui,Tahoma,sans-serif;color:#202c38;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e4e8ed;padding:15px 24px;display:flex;align-items:center;gap:16px;justify-content:space-between}.logo{font-weight:900;color:#e76c21;font-size:23px}.app{display:flex;min-height:calc(100vh - 67px)}aside{width:225px;background:#fff;border-left:1px solid #e4e8ed;padding:16px;flex-shrink:0}nav button{display:block;width:100%;text-align:right;border:0;background:transparent;padding:13px;border-radius:9px;cursor:pointer;color:#364152;font-size:15px}nav button.active{background:#fff0e5;color:#ba5314;font-weight:bold}main{padding:24px;width:100%;max-width:1200px;margin:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0 0 15px}h2{font-size:17px}.muted{color:#738092;font-size:13px}.card{background:white;border:1px solid #e5eaf0;border-radius:13px;padding:19px;margin:15px 0;box-shadow:0 2px 8px #152c4510}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{display:block;font-size:27px;margin-top:8px}input,select{border:1px solid #d7dee7;border-radius:8px;padding:11px;font:inherit;max-width:100%}input{min-width:220px}.btn{background:#ed752c;border:0;color:white;border-radius:9px;padding:10px 15px;cursor:pointer;font:inherit}.outline{background:white;border:1px solid #d8dfe8;color:#263747}.edit{color:#e46c1f;background:#fff2e8;border:0;border-radius:7px;padding:8px;cursor:pointer}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}td,th{padding:14px;text-align:right;border-bottom:1px solid #edf0f4}th{font-size:13px;color:#778396}tr:hover{background:#fafbfc}.tag{border-radius:15px;background:#eef5f1;color:#277451;padding:5px 10px;font-size:12px}.detail{display:none}.detail.open{display:block}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{padding:13px;background:#f8fafc;border-radius:8px}.field label{display:block;color:#788596;font-size:12px;margin-bottom:7px}.field input{width:100%}.notice{background:#fff8eb;border:1px solid #f4dfb3;padding:12px;border-radius:8px;font-size:13px}.bottom{display:none}@media(max-width:750px){header{padding:12px}aside{display:none}main{padding:14px 12px 75px}.stats{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;right:0;left:0;background:white;border-top:1px solid #ddd;justify-content:space-around;padding:8px 2px;z-index:5}.bottom button{background:none;border:0;font:12px system-ui;padding:7px;color:#374151}input{min-width:150px;width:100%}.toolbar{align-items:stretch}.toolbar>*{flex:1}.card{padding:13px}} </style><header><div class="logo">TALABOT <span class="muted">/ الإدارة — معاينة مستقلة</span></div><select id="role" onchange="render()"><option value="admin">مدير</option><option value="orders">موظف الطلبات</option><option value="finance">محاسب</option><option value="viewer">قراءة فقط</option></select></header><div class="app"><aside><nav id="nav"></nav><div class="notice" style="margin-top:24px">بيانات اصطناعية • لا اتصال بالخادم • لا عمليات مالية</div></aside><main><div class="toolbar"><div><h1 id="heading"></h1><div class="muted" id="sub"></div></div><button class="btn outline" onclick="back()">↩ رجوع</button></div><div id="content"></div></main></div><div class="bottom" id="bottom"></div><script>const sections=['الرئيسية','الطلبات','التوصيل','المتاجر','العملاء'];let section='الرئيسية',detail=null,editing=false,query='',filter='الكل',history=[];const data={'الطلبات':[['ORD-1042','ليلى مراد','قيد التحضير','185 TJS'],['ORD-1043','سامر خالد','بالطريق','92 TJS'],['ORD-1044','هالة يوسف','مكتمل','240 TJS']],'التوصيل':[['DRV-021','أحمد ناصر','متاح','3 مهام'],['DRV-022','كريم صالح','في توصيل','1 مهمة'],['DRV-023','رامي يوسف','غير متصل','0 مهام']],'المتاجر':[['ST-018','مطعم الورد','مطعم','نشط'],['ST-019','سوق المدينة','بقالة','نشط'],['ST-020','صيدلية النور','صيدلية','مراجعة']],'العملاء':[['CU-101','ليلى مراد','نشط','5 طلبات'],['CU-102','سامر خالد','نشط','3 طلبات'],['CU-103','هالة يوسف','مقيّد','1 طلب']]};function allowed(s){let r=document.getElementById('role').value;return r==='admin'||r==='viewer'||(r==='orders'&&s!=='الرئيسية')||(r==='finance'&&s==='الرئيسية')}function navigate(s){history.push([section,detail,query,filter]);section=s;detail=null;editing=false;query='';filter='الكل';render()}function back(){if(editing){editing=false;render();return}if(detail){detail=null;render();return}let h=history.pop();if(h){[section,detail,query,filter]=h;render()}}function openItem(i){detail=i;editing=false;render()}function render(){let role=document.getElementById('role').value;document.getElementById('nav').innerHTML=sections.map(s=>`<button class="${s===section?'active':''}" onclick="navigate('${s}')">${s}</button>`).join('');document.getElementById('bottom').innerHTML=sections.map(s=>`<button onclick="navigate('${s}')">${s}</button>`).join('');document.getElementById('heading').textContent=section+(detail!==null?' / '+data[section][detail][0]:'');document.getElementById('sub').textContent=detail!==null?'ملف تفصيلي — '+(editing?'وضع التعديل':'وضع العرض'):'نموذج بصري تجريبي • صلاحيات محاكاة فقط';let c=document.getElementById('content');if(!allowed(section)){c.innerHTML='<div class="card notice">هذا القسم غير متاح في سيناريو الدور المحدد. هذا إخفاء تجريبي، وليس فحص صلاحيات خادمية.</div>';return}if(section==='الرئيسية'){c.innerHTML='<div class="stats">'+[['طلبات اليوم','38'],['قيد التنفيذ','12'],['سائقون نشطون','17'],['متاجر نشطة','64']].map(x=>`<div class="card stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')+'</div><div class="card"><h2>اختصارات العمل</h2><button class="btn" onclick="navigate(\'الطلبات\')">مراجعة الطلبات</button> <button class="btn outline" onclick="navigate(\'التوصيل\')">التوصيل</button> <button class="btn outline" onclick="navigate(\'المتاجر\')">المتاجر</button></div><div class="card notice">الأرقام والأسماء والأنشطة هنا اصطناعية، وليست بيانات TALABOT الفعلية.</div>';return}let rows=data[section];if(detail!==null){let x=rows[detail];c.innerHTML=`<div class="card"><div class="toolbar"><h2>${x[1]}</h2>${role==='admin'&&!editing?'<button class="edit" onclick="editing=true;render()">✎ تعديل</button>':''}</div><div class="fields">${['المعرّف','الاسم','الحالة / النوع','معلومة إضافية'].map((label,j)=>`<div class="field"><label>${label}</label>${editing&&j>0?`<input id="f${j}" value="${x[j]}">`:`<strong>${x[j]}</strong>`}</div>`).join('')}</div>${editing?'<p><button class="btn" onclick="save()">حفظ تجريبي</button> <button class="btn outline" onclick="editing=false;render()">إلغاء</button></p>':''}</div><div class="card notice">${section==='الطلبات'?'مسار الطلب والدفع والإرجاع غير منفذ في المعاينة.':section==='التوصيل'?'تفاصيل محفظة السائق والتسويات غير متاحة في النموذج.':section==='المتاجر'?'أنواع المتاجر معروضة دون تغيير قواعدها الفعلية.':'العرض والتعديل منفصلان؛ الحفظ هنا محلي داخل المعاينة فقط.'}</div>`;return}let found=rows.map((x,i)=>({x,i})).filter(o=>o.x.join(' ').toLowerCase().includes(query.toLowerCase())&&(filter==='الكل'||o.x[2]===filter));c.innerHTML=`<div class="card"><div class="toolbar"><input id="search" placeholder="بحث مباشر بالاسم أو المعرف" value="${query.replaceAll('"','&quot;')}" oninput="query=this.value;updateRows()"><select id="filter" onchange="filter=this.value;updateRows()"><option>الكل</option>${[...new Set(rows.map(r=>r[2]))].map(v=>`<option ${filter===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>المعرّف</th><th>الاسم</th><th>الحالة / النوع</th><th>التفاصيل</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;updateRows()}function updateRows(){let rows=data[section],list=rows.map((x,i)=>({x,i})).filter(o=>o.x.join(' ').toLowerCase().includes(query.toLowerCase())&&(filter==='الكل'||o.x[2]===filter));document.getElementById('rows').innerHTML=list.map(({x,i})=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><span class="tag">${x[2]}</span></td><td>${x[3]}</td><td><button class="btn outline" onclick="openItem(${i})">عرض ←</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد نتائج مطابقة</td></tr>'}function save(){let x=data[section][detail];for(let j=1;j<4;j++)x[j]=document.getElementById('f'+j).value;editing=false;render()}render()</script></html>
